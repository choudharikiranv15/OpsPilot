[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-ai"
version = "0.1.6"
description = "AI-powered production incident analysis tool using multi-agent systems"
readme = "README.md"
authors = [
    {name = "Kiran Vijaykumar Choudhari", email = "choudharikiranv2003@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Typing :: Typed",
]
keywords = [
    "ai",
    "mlops",
    "devops",
    "incident-analysis",
    "sre",
    "production-monitoring",
    "agentic-ai",
    "multi-agent",
    "llm",
    "observability",
    "incident-response",
    "automation",
]

dependencies = [
    "typer>=0.12.0,<1.0",
    "rich>=13.7.0,<14.0",
    "httpx>=0.27.0,<1.0",  # Modern async HTTP client (replacing requests)
    "python-dotenv>=1.0.0,<2.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "structlog>=24.1.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",  # Modern linter (replaces black + flake8)
    "mypy>=1.9.0",
    "hypothesis>=6.98.0",  # Property-based testing
    "build>=1.0.0",
    "twine>=5.0.0",
]
redis = [
    "redis>=4.5.0",
]
aws = [
    "boto3>=1.26.0",
]
k8s = [
    "kubernetes>=25.0.0",
]
all = [
    "redis>=4.5.0",
    "boto3>=1.26.0",
    "kubernetes>=25.0.0",
]

[project.urls]
Homepage = "https://github.com/choudharikiranv15/OpsPilot-AI"
Documentation = "https://github.com/choudharikiranv15/OpsPilot-AI#readme"
Repository = "https://github.com/choudharikiranv15/OpsPilot-AI"
"Bug Tracker" = "https://github.com/choudharikiranv15/OpsPilot-AI/issues"
Changelog = "https://github.com/choudharikiranv15/OpsPilot-AI/releases"

[project.scripts]
opspilot = "opspilot.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["opspilot*"]

[tool.setuptools.package-data]
opspilot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.coverage.run]
source = ["opspilot"]
omit = ["tests/*", "opspilot/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable
check_untyped_defs = true
no_implicit_optional = true
